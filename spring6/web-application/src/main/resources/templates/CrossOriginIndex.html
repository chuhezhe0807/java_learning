<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>跨域测试</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
<div id="hello"></div>
</body>
<script>
    $(function () {
        // 本地host文件已有映射，为了在本地模拟跨域的情况
        // 127.0.0.1  test.chuhezhe.cc
        $.get("http://test.chuhezhe.cc:8081/crossorigin/hello", function (data) {
            $("#hello").text(data);
        })
    })
</script>
</html>
